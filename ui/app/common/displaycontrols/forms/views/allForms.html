<div class="template-container">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 10px 0;">
        <h6 style="margin: 0;">{{'ALL_KEY' | translate}} {{section | titleTranslate}}</h6>
        <div ng-if="section.enableFormSearch" style="width: 280px; padding: 4px 10px;">
            <input type="text"
                   ng-model="section.formSearchText"
                   maxlength="80"
                   autocomplete="off"
                   spellcheck="false"
                   placeholder="Search forms..."
                   style="width: 100%; height: 30px; padding: 4px 10px; border: 1px solid #c7c7c7; border-radius: 2px; box-sizing: border-box; font-size: 12px; outline: none;" />
        </div>
    </div>
    <div class="concept-set-container">
        <section class="block dashboard-section">
            <forms-table section="section" patient="patient" is-on-dashboard="false"></forms-table>
        </section>
    </div>
</div>
